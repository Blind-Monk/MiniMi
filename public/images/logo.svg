<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark Charcoal Background with subtle texture -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1E242B"/>
      <stop offset="100%" stop-color="#0B0D10"/>
    </radialGradient>

    <!-- Luxury Polished Metallic Gold Gradients -->
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="30%" stop-color="#FFC107"/>
      <stop offset="70%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>

    <linearGradient id="goldSpec" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="50%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>

    <linearGradient id="bulletGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>

    <!-- Warm Golden Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="knurlPattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 4 L4 0 M0 0 L4 4" stroke="#795548" stroke-width="0.8"/>
    </pattern>

    <pattern id="checkeredPattern" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#FFE082"/>
      <rect x="3" width="3" height="3" fill="#B71C1C"/>
      <rect y="3" width="3" height="3" fill="#B71C1C"/>
      <rect x="3" y="3" width="3" height="3" fill="#FFE082"/>
    </pattern>
  </defs>

  <!-- Dark Charcoal Background -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>

  <!-- Subtle Fabric Crease Overlay -->
  <path d="M-50 -50 L550 550 M-50 100 L400 550" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="30"/>

  <g filter="url(#goldGlow)" transform="translate(0, 10)">
    <!-- OUTER FOLDING STOCK ARMS LOOPING DOWN -->
    <path d="M 60,110 C 20,150 20,290 85,340 L 95,330 C 40,280 40,160 75,120 Z" fill="url(#goldBright)" stroke="#000" stroke-width="3"/>
    <path d="M 440,110 C 480,150 480,290 415,340 L 405,330 C 460,280 460,160 425,120 Z" fill="url(#goldBright)" stroke="#000" stroke-width="3"/>

    <!-- TOP WIDE HORIZONTAL RECEIVER -->
    <rect x="70" y="80" width="360" height="40" rx="6" fill="url(#goldSpec)" stroke="#000" stroke-width="4"/>

    <!-- Receiver Slotted Vents & Serrations -->
    <g fill="#212121">
      <rect x="90" y="92" width="18" height="16" rx="2"/>
      <rect x="116" y="92" width="18" height="16" rx="2"/>
      <rect x="142" y="92" width="18" height="16" rx="2"/>

      <!-- Right Serration Lines -->
      <line x1="340" y1="86" x2="330" y2="114" stroke="#212121" stroke-width="3"/>
      <line x1="352" y1="86" x2="342" y2="114" stroke="#212121" stroke-width="3"/>
      <line x1="364" y1="86" x2="354" y2="114" stroke="#212121" stroke-width="3"/>
      <line x1="376" y1="86" x2="366" y2="114" stroke="#212121" stroke-width="3"/>
    </g>

    <!-- Sight Posts at Ends -->
    <path d="M 75,80 L 82,62 L 95,62 L 92,80 Z" fill="url(#goldBright)" stroke="#000" stroke-width="2"/>
    <path d="M 425,80 L 418,62 L 405,62 L 408,80 Z" fill="url(#goldBright)" stroke="#000" stroke-width="2"/>

    <!-- CENTER VERTICAL CHARGING ROD WITH KNURLED COLLAR -->
    <rect x="242" y="50" width="16" height="380" rx="3" fill="url(#goldBright)" stroke="#000" stroke-width="3"/>
    <!-- Knurled Collar -->
    <rect x="236" y="115" width="28" height="35" rx="3" fill="url(#knurlPattern)" stroke="#000" stroke-width="2"/>

    <!-- LEFT SUBMACHINE GUN FORMING LEFT LEG & DIAGONAL -->
    <!-- Grip & Vertical Leg (splaying outward) -->
    <path d="M 85,120 L 140,120 L 115,410 L 60,400 Z" fill="url(#goldSpec)" stroke="#000" stroke-width="4"/>
    <!-- Extended Magazine attached to Leg -->
    <path d="M 125,200 L 165,205 L 145,430 L 105,425 Z" fill="url(#goldBright)" stroke="#000" stroke-width="3"/>

    <!-- Left Finger-Groove & Checkered Grip Panel -->
    <path d="M 72,280 Q 80,300 70,320 Q 80,340 68,360 L 98,365 L 108,285 Z" fill="url(#checkeredPattern)" opacity="0.8" stroke="#000" stroke-width="1.5"/>
    <!-- Selector Text -->
    <text x="82" y="180" font-family="monospace" font-size="8" font-weight="bold" fill="#000" letter-spacing="1">SAFE/SEMI/FULL</text>

    <!-- Inner Diagonal Stroke meeting at center sharp point (250, 270) -->
    <path d="M 140,120 L 250,270 L 230,285 L 115,160 Z" fill="url(#goldBright)" stroke="#000" stroke-width="3"/>

    <!-- RIGHT SUBMACHINE GUN FORMING RIGHT LEG & DIAGONAL (MIRRORED) -->
    <!-- Grip & Vertical Leg (splaying outward) -->
    <path d="M 415,120 L 360,120 L 385,410 L 440,400 Z" fill="url(#goldSpec)" stroke="#000" stroke-width="4"/>
    <!-- Extended Magazine attached to Leg -->
    <path d="M 375,200 L 335,205 L 355,430 L 395,425 Z" fill="url(#goldBright)" stroke="#000" stroke-width="3"/>

    <!-- Right Finger-Groove & Checkered Grip Panel -->
    <path d="M 428,280 Q 420,300 430,320 Q 420,340 432,360 L 402,365 L 392,285 Z" fill="url(#checkeredPattern)" opacity="0.8" stroke="#000" stroke-width="1.5"/>
    <!-- Square Marking on Right Grip -->
    <rect x="400" y="170" width="12" height="12" fill="#212121" stroke="#FFD54F" stroke-width="1.5"/>

    <!-- Inner Diagonal Stroke meeting at center sharp point (250, 270) -->
    <path d="M 360,120 L 250,270 L 270,285 L 385,160 Z" fill="url(#goldBright)" stroke="#000" stroke-width="3"/>

    <!-- THIRD CENTER VERTICAL MAGAZINE HANGING FROM CENTER POINT (250, 270) -->
    <path d="M 230,270 L 270,270 L 265,450 L 235,450 Z" fill="url(#goldSpec)" stroke="#000" stroke-width="4"/>

    <!-- Visible Bullets inside Center Magazine -->
    <g fill="url(#bulletGold)" stroke="#000" stroke-width="1">
      <rect x="238" y="290" width="24" height="8" rx="2"/>
      <rect x="238" y="310" width="24" height="8" rx="2"/>
      <rect x="238" y="330" width="24" height="8" rx="2"/>
      <rect x="238" y="350" width="24" height="8" rx="2"/>
      <rect x="238" y="370" width="24" height="8" rx="2"/>
      <rect x="238" y="390" width="24" height="8" rx="2"/>
      <rect x="238" y="410" width="24" height="8" rx="2"/>
      <rect x="238" y="430" width="24" height="8" rx="2"/>
    </g>

    <!-- Sharpened Center Point Highlight -->
    <polygon points="250,262 262,280 238,280" fill="#FFF8E1" stroke="#000" stroke-width="2"/>
  </g>
</svg>
